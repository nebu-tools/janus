name: Janus

# Markdown alone runs nothing; "Run workflow" runs it by hand.
on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; keep branch-push runs (they are the record).
concurrency:
  group: janus-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  janus-pdf:
    name: janus-pdf (ruff format, ruff check, ty, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/janus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
        # Docling pulls in torch and model weights; its tests skip without it.
      - run: uv sync --locked --extra triage
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ty check src tests scripts
      - run: uv run --no-sync pytest

  examples:
    name: Examples (the commands in the READMEs print what the READMEs show)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project packages/janus
      - run: uv run --no-sync --project packages/janus ruff format --check --config packages/janus/pyproject.toml examples
      - run: uv run --no-sync --project packages/janus ruff check --config packages/janus/pyproject.toml examples
      - run: uv run --no-sync --project packages/janus python examples/check_readme.py README.md examples/README.md
