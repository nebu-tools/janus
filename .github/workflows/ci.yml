name: Janus

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; keep branch-push runs (they are the record).
concurrency:
  group: janus-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  janus-pdf:
    name: janus-pdf (ruff format, ruff check, ty, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/janus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
        # Docling pulls in torch and model weights; its tests skip without it.
      - run: uv sync --locked --extra triage
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run ty check src tests scripts
      - run: uv run pytest

  examples:
    name: Examples (the commands in the READMEs print what the READMEs show)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --project packages/janus
      - run: uv run --project packages/janus ruff format --check --config packages/janus/pyproject.toml examples
      - run: uv run --project packages/janus ruff check --config packages/janus/pyproject.toml examples
      - run: uv run --project packages/janus pytest examples
      - run: uv run --project packages/janus python examples/check_readme.py README.md examples/README.md
      - name: Rebuild the examples; fail when a committed file differs
        working-directory: examples
        run: |
          uv run --project ../packages/janus python make_examples.py
          git status --porcelain .
          test -z "$(git status --porcelain .)"

  install:
    name: Install (the checkout installs without extras, and janus runs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx --isolated --from ./packages/janus janus --help
