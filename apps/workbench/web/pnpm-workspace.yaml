# The client is one package. The server beside it is a Python project (uv).
packages:
  - .

allowBuilds:
  esbuild: true
  "@tsc-rs/typescript": true

catalog:
  "@effect/openapi-generator": 4.0.6
  "@playwright/test": 1.64.1
  "@types/node": 26.6.5
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@vitejs/plugin-react": 6.1.2
  react: 19.3.1
  react-dom: 19.3.1
  typescript: npm:@tsc-rs/typescript@0.8.0
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

# One Vite: every plugin must see Vite+ core, not a second vite.
overrides:
  vite: "catalog:"
