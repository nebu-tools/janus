[project]
name = "janus-pdf"
version = "0.1.0.dev0"
description = "PDF evidence: read text and layout, extract typed values with the page and box each came from, compare with reference data"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Maximilian Scholz" }]
dependencies = [
    "pydantic>=2.10",
    "pymupdf>=1.26",
    "pypdfium2>=4.30",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
]

[project.scripts]
janus = "janus_pdf.cli:main"

[project.optional-dependencies]
triage = ["pdf-inspector>=1.25.2"]
docling = ["docling>=2.143.1"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "ty>=0.0.1a0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_pdf"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
    "TID",    # flake8-tidy-imports
]
ignore = ["E501"]  # the formatter wraps lines

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads annotations at runtime.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "janus_pdf.document.model.Record"]

[tool.ruff.lint.isort]
known-first-party = ["janus_pdf"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["benchmark: timings against the targets in DESIGN.md (run with -m benchmark)"]
addopts = "-m 'not benchmark'"
